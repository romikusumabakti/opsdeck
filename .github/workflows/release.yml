name: Release

# A tag vX.Y.Z (stable) or vX.Y.Z-beta.N (beta, a prerelease) builds the
# multi-arch image to GHCR, attests its provenance and publishes the GitHub
# Release that install.sh and the host updater read (release.json).
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/romikusumabakti/opsdeck

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # postgres.js connects lazily, so a dummy URL is enough for typecheck.
      DATABASE_URL: postgres://user:pass@localhost:5432/db
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write # push to GHCR
      id-token: write # sign the provenance attestation
      attestations: write
      artifact-metadata: write # the registry storage record
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version and channel from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?'; then
            echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi
          version=${TAG#v}
          case $version in
            *-beta.*) channel=beta prerelease=true ;;
            *) channel=stable prerelease=false ;;
          esac
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: OPSDECK_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.channel }}

      # actions/attest without a predicate or SBOM writes SLSA build
      # provenance (upstream's recommendation over attest-build-provenance).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Pin the base images by digest
        run: |
          : > base-images.env
          grep -Ev '^[[:space:]]*(#|$)' release/base-images.txt | while IFS='=' read -r key ref; do
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            printf '%s=%s@%s\n' "$key" "$ref" "$digest" >> base-images.env
          done
          cat base-images.env

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Write release.json
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          bun scripts/release-manifest.ts \
            --version "$VERSION" \
            --app "$IMAGE:$VERSION@$DIGEST" \
            --images base-images.env \
            --min-from release/min-from.txt \
            --out release.json

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release.json
            ops/install/install.sh
            ops/install/update.sh
            ops/install/compose.yaml
            ops/install/env.example
            ops/install/opsdeck-updater@.path
            ops/install/opsdeck-updater@.service
