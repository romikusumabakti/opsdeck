name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # postgres.js connects lazily, so a dummy URL is enough for build/typecheck.
      DATABASE_URL: postgres://user:pass@localhost:5432/db
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Not used to run anything — `next build` needs a real `node` on PATH for
      # Turbopack's child-process plugin runtime, or it segfaults on teardown.
      # ubuntu-latest ships one, but pin it rather than inherit the image's.
      - name: Setup Node (for next build only)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
