# Generated by DSS Panel for dplk-membership — edit the build spec in the Panel, not this file.
when:
  - event: [push, manual]
    branch: [main]

steps:
  - name: backend-tests
    image: eclipse-temurin:25-jdk
    commands:
      # All commands of a step run in ONE shell, so the check runs in a
      # subshell to keep its `cd` from leaking into the next block.
      - |
        (
          cd backend
          chmod +x gradlew
          ./gradlew --no-daemon test
        )

  - name: build
    image: docker:29-cli
    depends_on: [backend-tests]
    environment:
      REGISTRY: 192.168.10.113:5000
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      # Same tag Jenkins produced for a commit: origin-<branch, / -> ->-<sha>.
      - |
        TAG="origin-$(printf '%s' "$${CI_COMMIT_BRANCH}" | tr / -)-$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-9)"
        printf '%s' "$${TAG}" > .tag
        echo "tag $${TAG}"
      # docker login needs a daemon; write the client auth file directly.
      - |
        mkdir -p ~/.docker
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$${REGISTRY}" "$(printf '%s:%s' "$${REGISTRY_USERNAME}" "$${REGISTRY_PASSWORD}" | base64 | tr -d '\n')" > ~/.docker/config.json
      - docker buildx create --name remote --driver remote tcp://buildkitd:1234 --use
      - |
        TAG=$(cat .tag)
        docker buildx build --push -f backend/Dockerfile -t "$${REGISTRY}/dplk-membership-backend:$${TAG}" backend
        docker buildx build --push -f frontend/Dockerfile -t "$${REGISTRY}/dplk-membership-frontend:$${TAG}" frontend
      # Deploy bundle: only the listed files, laid out as the deploy dir.
      - |
        TAG=$(cat .tag)
        mkdir -p .bundle/bundle
        cp -r compose.yaml .bundle/bundle/compose.yaml
        mkdir -p .bundle/bundle/migrate
        cp -r deploy/migrate/init_db.sql .bundle/bundle/migrate/init_db.sql
        printf 'FROM scratch\nCOPY bundle /bundle\n' > .bundle/Dockerfile
        docker buildx build --push -t "$${REGISTRY}/dplk-membership-deploy:$${TAG}" .bundle

  - name: notify-panel
    image: alpine:3
    depends_on: [build]
    environment:
      OPSDECK_NOTIFY_SECRET:
        from_secret: opsdeck_notify
    commands:
      - apk add --no-cache curl openssl >/dev/null
      # Values are safe in printf JSON: branch/tag/commit are validated by the
      # Panel against regexes that exclude quotes and backslashes.
      - |
        TAG=$(cat .tag)
        URL=""
        if [ -n "$${CI_PIPELINE_URL:-}" ]; then URL=",\"pipelineUrl\":\"$${CI_PIPELINE_URL}\""; fi
        printf '{"app":"dplk-membership","branch":"%s","tag":"%s","commit":"%s"%s}' "$${CI_COMMIT_BRANCH}" "$${TAG}" "$${CI_COMMIT_SHA}" "$${URL}" > body.json
        SIG=$(openssl dgst -sha256 -hmac "$${OPSDECK_NOTIFY_SECRET}" -r body.json | cut -d' ' -f1)
        curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 30 -H 'Content-Type: application/json' -H "X-Opsdeck-Signature: sha256=$${SIG}" --data-binary @body.json https://panel.example.net/api/deploy-hooks/builds
